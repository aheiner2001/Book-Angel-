romance_level: mild
violence_level: adventure
language_level: cleaned
omitted_topics:
- graphic sexual content
- extreme gore or torture
custom_rules:
- Preserve character wit, banter, and story pacing.
- Maintain the author's narrative prose style and tone.
examples:
- before: He grabbed her roughly and crushed his mouth against hers in a fiery, desperate
    kiss.
  after: He reached out and gently took her hand, leaning in to give her a warm, affectionate
    kiss on the cheek.
- before: The blade tore through his flesh, spilling blood and internal organs across
    the stones.
  after: The blade struck with a heavy thud, disarming him instantly and sending him
    crashing to the floor.
character_mappings:
- original_name: Julian
  new_name: Julia
  new_gender: female
  pronouns: she/her/hers
  instruction: Transform Julian into a female love interest named Julia. Adapt all
    pronouns (he->she, him->her, his->her/hers) and physical descriptors so the relationship
    with the protagonist is completely natural.
